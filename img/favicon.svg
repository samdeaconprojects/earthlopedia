<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <!-- Static snapshot of the .earth-logo spinning globe (see css/styles.css
       GLOBE:START block and tools/globe-editor.html). Frozen at one frame
       of the landmass pattern rather than hand-drawn. -->
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#80eaff"/>
      <stop offset="60%" stop-color="#59c5e8"/>
      <stop offset="100%" stop-color="#2075b6"/>
    </linearGradient>
    <radialGradient id="highlight" cx="32%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="68%" cy="78%" r="58%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="36" cy="36" r="36"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <rect width="72" height="72" fill="url(#ocean)"/>

    <g style="mix-blend-mode:multiply">
      <ellipse cx="19.5" cy="15" rx="12" ry="9" fill="#3f8a4c" fill-opacity="0.95" transform="rotate(10 19.5 15)"/>
      <ellipse cx="36" cy="24" rx="10.5" ry="13.5" fill="#357a41" fill-opacity="0.9" transform="rotate(-10 36 24)"/>
      <ellipse cx="30" cy="42" rx="9" ry="12" fill="#4a9957" fill-opacity="0.9" transform="rotate(5 30 42)"/>
      <ellipse cx="42" cy="51" rx="6" ry="5.25" fill="#3f8a4c" fill-opacity="0.9"/>
      <ellipse cx="36" cy="36" rx="12" ry="9" fill="#3f8a4c" fill-opacity="0.9"/>
    </g>

    <rect width="72" height="72" fill="url(#highlight)"/>
    <rect width="72" height="72" fill="url(#shade)"/>
    <circle cx="36" cy="36" r="35.5" fill="none" stroke="#000000" stroke-opacity="0.06"/>
  </g>
</svg>
